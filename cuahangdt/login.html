<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <style>
        input.error {
            border: 2px solid red;
        }

        #login-message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Đăng Nhập</h2>
        <form id="login-form">
            <input type="text" id="login-username" name="username" placeholder="Tên đăng nhập" required>
            <input type="password" id="login-password" name="password" placeholder="Mật khẩu" required>
            <button type="submit">Đăng nhập</button>
        </form>
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
        <p id="login-message"></p>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const loginForm = document.getElementById("login-form");
        const usernameInput = document.getElementById("login-username");
        const passwordInput = document.getElementById("login-password");
        const messageDiv = document.getElementById("login-message");

        loginForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            // Reset errors
            usernameInput.classList.remove("error");
            passwordInput.classList.remove("error");
            messageDiv.innerText = "";

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                messageDiv.innerText = "Vui lòng nhập đầy đủ thông tin!";
                messageDiv.style.color = "red";
                if (!username) usernameInput.classList.add("error");
                if (!password) passwordInput.classList.add("error");
                return;
            }

            const formData = new FormData();
            formData.append("username", username);
            formData.append("password", password);

            try {
                const response = await fetch("login.php", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                console.log(data);

                if (data.status === "success") {
                    messageDiv.innerText = "Đăng nhập thành công! Đang chuyển trang...";
                    messageDiv.style.color = "green";

                    // Chuyển tới trang home đầu tiên
                    setTimeout(() => {
                        window.location.href = "home.html"; // Trang trung gian
                    }, 1500);
                } else {
                    messageDiv.innerText = data.message;
                    messageDiv.style.color = "red";
                    usernameInput.classList.add("error");
                    passwordInput.classList.add("error");
                }
            } catch (error) {
                console.error("Lỗi:", error);
                messageDiv.innerText = "Đã xảy ra lỗi. Vui lòng thử lại sau.";
                messageDiv.style.color = "red";
            }
        });
    });
    </script>
</body>
</html>
