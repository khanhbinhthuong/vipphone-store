<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .home-container {
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .home-container h2 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .home-container p {
            color: #7f8c8d;
            font-size: 1.2em;
        }

        .home-container .message {
            font-weight: 600;
            color: #e67e22;
        }

        .home-container .redirect {
            margin-top: 20px;
            font-size: 1.1em;
            color: #2980b9;
        }

        .home-container .btn {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .home-container .btn:hover {
            background-color: #3498db;
        }
        
    </style>
</head>
<body>
    <h2>Welcome, <span id="userDisplay"></span>!</h2>

<script>
  const user = localStorage.getItem("loggedInUser");
  if (user) {
    document.getElementById("userDisplay").textContent = user;
  } else {
    // Nếu chưa đăng nhập, quay lại login
    window.location.href = "login.html";
  }
</script>
    <div class="home-container">
        <h2>🎉 Login Successful!</h2>
        <p>Welcome back to the system!</p>
        <p class="message">To go to the homepage, please click the button below:</p>
        <a href="index.html" class="btn">Go to Homepage</a>
    </div>
</body>
</html>
